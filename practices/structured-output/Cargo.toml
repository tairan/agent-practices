[package]
name = "structured-output"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false

[workspace]
resolver = "3"

[dependencies]
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
async-trait = "=0.1.89"
thiserror = "=2.0.18"
anyhow = "=1.0.102"
jsonschema = "=0.46.5"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
sha2 = "=0.10.9"
toml = "=0.9.8"

[dev-dependencies]
tempfile = "=3.27.0"
